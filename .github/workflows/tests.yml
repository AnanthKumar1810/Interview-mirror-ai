name: Python tests
on:
  push:
  pull_request:
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run offline tests (no Gnani credentials)
        run: python -m pytest -q
      - name: Gate numerical-scoring regressions against checked-in baseline
        run: |
          python -m eval_harness.run \
            --dataset eval_harness/datasets/practice_review_queue.json \
            --repeats 5 \
            --compare reports/phase1_baseline.json \
            --max-absolute-score-drift 0 \
            --max-within-case-std 0 \
            --require-evidence \
            --output reports/phase1_ci.json

      - name: Gate improved rubric dimensional drift
        run: |
          python -m eval_harness.run \
            --dataset eval_harness/datasets/practice_review_queue.json \
            --scorer robust \
            --repeats 5 \
            --compare reports/risk_aware_baseline.json \
            --max-absolute-score-drift 0 \
            --max-within-case-std 0 \
            --require-evidence \
            --output reports/risk_aware_ci.json
      - name: Render evaluation workbench
        run: |
          python -m eval_harness.workbench --report reports/risk_aware_ci.json --output reports/workbench_ci.html
          python -m eval_harness.agreement --dataset eval_harness/datasets/gold_holdout_template.json --output reports/human_agreement_ci.json
      - name: Upload synthetic scoring reports
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-workbench-python-${{ matrix.python-version }}
          path: |
            reports/phase1_ci.json
            reports/risk_aware_ci.json
            reports/workbench_ci.html
            reports/human_agreement_ci.json
      - name: Gate synthetic adversarial failures (not human MAE)
        run: python -m eval_harness.compare_robust --output reports/robust_ci.json

  rtc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install optional RTC dependencies
        run: python -m pip install -r requirements-livekit.txt -r requirements-dev.txt
      - name: Import the RTC worker and run offline protocol tests
        run: |
          python -c 'import rtc_agent; print("RTC worker imported")'
          python -m pytest -q tests/test_rtc_policy.py tests/test_ws_protocol.py tests/test_handsfree_turn_regressions.py
